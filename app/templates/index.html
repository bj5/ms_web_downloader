<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModelScope Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .model-card:hover { transform: translateY(-4px); transition: all 0.3s; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <nav class="p-6 border-b border-gray-800 bg-gray-900 sticky top-0 z-10">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-500">ModelScope Downloader</h1>
            <input type="text" id="search" placeholder="Search models..." 
                   class="bg-gray-800 border border-gray-700 rounded px-4 py-2 w-64 focus:outline-none focus:border-blue-500">
        </div>
    </nav>

    <main class="container mx-auto p-8">
        <div id="status-bar" class="mb-8 p-4 bg-gray-800 rounded border border-gray-700">
            <h2 class="text-lg font-semibold mb-2">Download Status</h2>
            <ul id="status-list" class="space-y-1 text-sm">
                {% for model_id, state in status.items() %}
                <li><code class="text-green-400">{{ model_id }}</code> &mdash; {{ state }}</li>
                {% endfor %}
            </ul>
        </div>

        <div id="model-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Populated by JS from /api/models -->
        </div>
    </main>

    <script>
        const searchInput = document.getElementById('search');
        const modelGrid = document.getElementById('model-grid');
        const statusList = document.getElementById('status-list');

        // Search calls the backend, which queries ModelScope's OpenAPI
        function renderCards(models) {
            modelGrid.innerHTML = models.length
                ? models.map((m) => `
                    <div class="model-card bg-gray-800 p-6 rounded-xl border border-gray-700 flex flex-col justify-between">
                        <div>
                            <h3 class="text-xl font-bold mb-2">${m.name}</h3>
                            <p class="text-gray-400 text-sm mb-4">${m.description || ''}</p>
                            <code class="block bg-black p-2 rounded text-xs text-green-400 mb-4">${m.id}</code>
                            <p class="text-gray-500 text-xs">${m.file_size_gb ? m.file_size_gb + ' GB &middot; ' : ''}${m.license || ''}</p>
                        </div>
                        <button onclick="downloadModel('${m.id}')"
                                class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded font-bold transition">
                            Download
                        </button>
                    </div>`).join('')
                : '<p class="text-gray-400">No models found</p>';
        }

        async function searchModels(query) {
            const res = await fetch('/api/models?query=' + encodeURIComponent(query));
            const data = await res.json();
            if (!res.ok) {
                modelGrid.innerHTML = `<p class="text-red-400">${data.detail || 'Search failed'}</p>`;
                return;
            }
            renderCards(data);
        }

        let searchTimer = null;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => searchModels(e.target.value), 300);
        });

        // Initial listing (ModelScope's default order for an empty query)
        searchModels('');

        async function downloadModel(modelId) {
            const response = await fetch('/api/download', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ model_id: modelId })
            });
            const data = await response.json();
            alert(data.message || data.error);
            updateStatus();
        }

        async function updateStatus() {
            const res = await fetch('/api/status');
            const status = await res.json();
            statusList.innerHTML = Object.entries(status)
                .map(([id, state]) => `<li><code class="text-green-400">${id}</code> &mdash; ${state}</li>`)
                .join('') || '<li class="text-gray-500">No downloads yet</li>';
        }

        // Polling for status every 3 seconds
        setInterval(updateStatus, 3000);
    </script>
</body>
</html>
