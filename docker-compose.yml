services:
  web-app:
    build: .
    container_name: modelscope_web_downloader
    ports:
      - "8000:8000"
    environment:
      - MODELSCOPE_API_KEY=${MODELSCOPE_API_KEY}
      - DOWNLOAD_DIR=${DOWNLOAD_DIR}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./models:/models
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 状态存储：Redis hash "download_status"，数据持久化在 redis_data 卷
  redis:
    image: redis:7-alpine
    container_name: modelscope_web_downloader_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 可选：如果需要更复杂的任务队列，可以在这里添加 Celery

volumes:
  redis_data:
